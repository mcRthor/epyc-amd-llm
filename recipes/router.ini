; router.ini - model presets for the llama.cpp router (start-router.sh, port 9700, Radeon AI PRO R9700 32 GB)
;
; One llama-server in router mode holds all these models and loads one at a time (--models-max 1),
; swapping on demand by the "model" field of each request. Section name = model name; "alias" adds
; more names. Edit the paths (/home/llm/locai/models/...) to where your GGUF files are.
; These presets run on llama.cpp ROCm build b1359 (gfx120X). Numbers and the build each was measured on: BENCHMARKS.md.

[research-qwen3.6]
; Qwen3.6 27B dense - main chat and research. Hard coding set 278/309 (90%).
model = /home/llm/locai/models/qwen3.6-27b/Qwen3.6-27B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/qwen3.6-27b/mmproj-F16.gguf
alias = research-qwen3.6,qwen3.6
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[review-qwen3.8]
; Qwen3.8 27B dense - reviewer.
model = /home/llm/locai/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/qwen3.8-27b/mmproj-F16.gguf
alias = review-qwen3.8,qwen3.8
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[agent-glimmer]
; Meta Muse-Glimmer 30B dense - best coding score here (302/309 without a draft). Always reasons first:
; send max_tokens 32000 on hard problems.
; DFlash draft (1.6 GB, proposes up to 15 tokens per step): about 31 -> 60 tok/s. Answers grow about a third
; longer with it and now and then one never finishes, so send a large max_tokens (32000). Remove the three
; draft lines to go back.
model = /home/llm/locai/models/muse-glimmer-30b/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-BF16.gguf
alias = agent-glimmer,glimmer
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 64
model-draft = /home/llm/locai/models/muse-glimmer-30b/dflash-kquant.gguf
spec-type = draft-dflash
spec-draft-n-max = 15

[code-flint]
; Recursive Flint 40B-A2.5B MoE (Apache 2.0) - coding agent with tool calls, text only.
; Needs llama.cpp b1359 or newer (b1350 lacks the "flint" architecture).
; Hard set 299/309, 19/21 solved, 74 tok/s; 26.2 GB VRAM at ctx 65536 (sliding-window attention keeps the KV
; cache at about 1.9 GB). Send max_tokens 32000 and keep reasoning_content in the history (model card).
model = /home/llm/locai/models/flint/flint-UD-Q4_K_XL.gguf
alias = code-flint,flint
ctx-size = 65536
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[agent-bolt]
; NVIDIA Nemotron 3.5 Bolt 74B-A9B "24GB" (OpenMDW) - agent: tools, browsing, terminal, images.
; NVIDIA's own 2-bit build (experts IQ2_XXS, trained for it; Mamba layers NVFP4): 22.0 GB + vision 1.7 GB
; + LiLiCorr DFlash draft 1.0 GB. Only 8 of 88 layers use attention, so 131072 context fits at f16:
; 30.1 GB VRAM loaded. 74 tok/s on prose, 122 tok/s on code with the draft.
; Hard set 259/309, 19/21 solved, 104 tok/s. It sometimes loops on an edge-case checklist until max_tokens;
; the reasoning budget below forces an answer after 24000 thinking tokens.
; Thinking is on by default; send chat_template_kwargs {"enable_thinking": false} to turn it off.
model = /home/llm/locai/models/nemotron-3.5-bolt-74b-24gb/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
mmproj = /home/llm/locai/models/nemotron-3.5-bolt-74b-24gb/mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
model-draft = /home/llm/locai/models/nemotron-3.5-bolt-74b-24gb/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
alias = agent-bolt,bolt-24gb
reasoning-budget = 24000
reasoning-budget-message = Time is up. I will stop checking now and write the final answer.
ctx-size = 131072
ngl = 99
temp = 1.0
top-p = 0.95

[reason-nemotron]
; NVIDIA Llama-3.3 Nemotron Super 49B v1.5 dense - reasoning and tool calls, text only.
; UD-Q3_K_XL 24.8 GB (the 4-bit file is 30.4 GB, too big with context); 27.1 GB VRAM at ctx 32768 with a
; q8_0 KV cache (needs flash attention); 21.7 tok/s. Put /no_think in the system prompt to turn reasoning off.
model = /home/llm/locai/models/nemotron-super-49b/Llama-3_3-Nemotron-Super-49B-v1_5-UD-Q3_K_XL.gguf
alias = reason-nemotron,nemotron-super-49b
ctx-size = 32768
ngl = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.6
top-p = 0.95

[fast-qwen]
; Qwen3.6 35B-A3B MoE (about 3B active) - fast chat, research and tool calls, about 65 tok/s.
model = /home/llm/locai/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/qwen3.6-35b-a3b/mmproj-F16.gguf
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[reason-glm]
; GLM-4.7-Flash 30B-A3B MoE - reasoning and tool use (card: temp 0.7, top-p 1.0 for tool calling).
model = /home/llm/locai/models/glm-4.7-flash/GLM-4.7-Flash-UD-Q4_K_XL.gguf
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
min-p = 0.01
repeat-penalty = 1.0

[vision-gemma]
; Gemma 4 31B - images, screenshots, documents.
model = /home/llm/locai/models/gemma-4-31b/gemma-4-31B-it-UD-Q4_K_XL.gguf
mmproj = /home/llm/locai/models/gemma-4-31b/mmproj-F16.gguf
ctx-size = 49152
ngl = 99
temp = 1.0
top-p = 0.95
top-k = 64

; ---------------------------------------------------------------------------------------------
; Bigger MoE models with experts in system RAM (n-cpu-moe). Tested 2026-10-27 on the R9700 + 128 GB
; DDR4-2400, then removed to save disk; kept here as working examples. n-cpu-moe = N keeps the expert
; weights of the first N layers in RAM. Tune it on a spare port until 1-2 GB of VRAM stays free.
;
; [deep-ornith]
; ; Ornith 1.5 122B MoE (Qwen3.5 arch, MIT), 79.7 GB: 11 tok/s, 293 tok/s prompt.
; model = /home/llm/locai/models/ornith-1.5-122b/UD-Q4_K_XL/Ornith-1.5-122B-UD-Q4_K_XL-00001-of-00003.gguf
; ctx-size = 49152
; ngl = 99
; n-cpu-moe = 33
; temp = 0.6
; top-p = 0.95
; top-k = 20
; presence-penalty = 0.0
;
; [deep-nemotron]
; ; NVIDIA Nemotron 3.5 Super VL 120B-A12B, 81 GiB: 27.5 GB VRAM at n-cpu-moe 72 (about 56 GiB of experts
; ; in RAM), 6.1 tok/s, 234 tok/s on a 39K-token prompt.
; n-cpu-moe = 72
;
; [deep-laguna]
; ; Poolside Laguna S 2.1 118B-A8B: 30.5 GB VRAM at n-cpu-moe 32, 13.4 tok/s, 372 tok/s prompt.
; n-cpu-moe = 32
;
; [deep-bolt]
; ; NVIDIA Nemotron 3.5 Bolt 74B-A9B at 4 bits (UD-Q4_K_XL): 29.3 GB VRAM at n-cpu-moe 52, 19.4 tok/s,
; ; 538 tok/s prompt.
; n-cpu-moe = 52
